<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Login - YOUR PLAY</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">

<div class="auth-container">
  <div class="auth-bg-anim">
    <div class="floating-shape s1"></div>
    <div class="floating-shape s2"></div>
    <div class="floating-shape s3"></div>
  </div>

  <div class="auth-card">
    <div class="logo big">
      <div class="logo-icon">▶</div>
      <span>YOUR<span class="accent">PLAY</span></span>
    </div>

    <div class="auth-tabs">
      <button class="active" onclick="switchTab('login')">Masuk</button>
      <button onclick="switchTab('register')">Daftar</button>
    </div>

    <form id="loginForm" class="auth-form" onsubmit="handleLogin(event)">
      <div class="input-group">
        <label>Email</label>
        <input type="email" id="loginEmail" required placeholder="email@example.com">
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="loginPass" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn-primary full">Masuk Sekarang</button>
      <p class="auth-note">Belum punya akun? <a onclick="switchTab('register')">Daftar</a></p>
    </form>

    <form id="registerForm" class="auth-form hidden" onsubmit="handleRegister(event)">
      <div class="input-group">
        <label>Nama Lengkap</label>
        <input type="text" id="regName" required placeholder="Nama kamu">
      </div>
      <div class="input-group">
        <label>Email</label>
        <input type="email" id="regEmail" required placeholder="email@example.com">
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="regPass" required placeholder="Min 6 karakter" minlength="6">
      </div>
      <button type="submit" class="btn-primary full">Buat Akun</button>
      <p class="auth-note">Sudah punya akun? <a onclick="switchTab('login')">Masuk</a></p>
    </form>

    <a href="index.html" class="back-home">← Kembali ke Beranda</a>
  </div>
</div>

<script src="js/auth.js"></script>
<script>
  function switchTab(tab) {
    document.querySelectorAll('.auth-tabs button').forEach(b => b.classList.remove('active'));
    if (tab === 'login') {
      document.querySelectorAll('.auth-tabs button')[0].classList.add('active');
      document.getElementById('loginForm').classList.remove('hidden');
      document.getElementById('registerForm').classList.add('hidden');
    } else {
      document.querySelectorAll('.auth-tabs button')[1].classList.add('active');
      document.getElementById('registerForm').classList.remove('hidden');
      document.getElementById('loginForm').classList.add('hidden');
    }
  }
</script>
</body>
</html>
