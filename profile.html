<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Profil - YOUR PLAY</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
  <div class="nav-left">
    <div class="logo" onclick="location.href='index.html'">
      <div class="logo-icon">▶</div>
      <span>YOUR<span class="accent">PLAY</span></span>
    </div>
  </div>
  <div class="nav-right">
    <div id="userArea"></div>
  </div>
</nav>

<main class="container profile-page">

  <div class="profile-header">
    <div class="profile-avatar" id="profileAvatar">P</div>
    <div class="profile-info">
      <h1 id="profileName">User</h1>
      <p id="profileEmail">email@example.com</p>
      <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="profile-tabs">
    <button class="active" onclick="showTab('watchlist')">💾 Watchlist</button>
    <button onclick="showTab('history')">📜 Riwayat Tonton</button>
  </div>

  <div id="watchlistTab" class="tab-content">
    <div class="grid" id="watchlistGrid"></div>
  </div>

  <div id="historyTab" class="tab-content hidden">
    <div class="grid" id="historyGrid"></div>
  </div>

</main>

<footer>
  <div class="footer-bottom">
    <p>© 2024 YOUR PLAY — Made with 💫 by <span class="accent">Pan</span></p>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>loadProfile();</script>
</body>
</html>
