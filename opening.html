<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YOUR PLAY</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', 'Segoe UI', sans-serif;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    cursor: pointer;
  }

  /* ===== STAGE ===== */
  .stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at center, #12121a 0%, #0a0a0f 50%, #000 100%);
    overflow: hidden;
    transition: background 1s;
  }
  /* Theme Variations */
  .stage.theme-ice { background: radial-gradient(circle at center, #0a1220, #060a15, #000); }
  .stage.theme-fire { background: radial-gradient(circle at center, #1a0808, #0f0404, #000); }
  .stage.theme-purple { background: radial-gradient(circle at center, #140a1f, #0a0510, #000); }

  /* ===== BACKGROUND PARTICLES ===== */
  .particles {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 2;
  }
  .particle {
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: #ff1744;
    box-shadow: 0 0 10px #ff1744, 0 0 20px #ff1744;
    opacity: 0;
    animation: particleFloat 8s infinite linear;
  }
  .particle.blue {
    background: #2979ff;
    box-shadow: 0 0 10px #2979ff, 0 0 20px #2979ff;
  }
  @keyframes particleFloat {
    0% {
      opacity: 0;
      transform: translateY(100vh) scale(0);
    }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% {
      opacity: 0;
      transform: translateY(-100px) scale(1);
    }
  }

  /* ===== SPEED LINES ===== */
  .speed-lines {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    animation: speedLinesShow 1.5s 0.3s forwards;
    z-index: 3;
  }
  @keyframes speedLinesShow {
    to { opacity: 1; }
  }
  .speed-line {
    position: absolute;
    height: 1px;
    background: linear-gradient(90deg, transparent, #ff1744, transparent);
    animation: speedLineMove 1.5s infinite linear;
  }
  @keyframes speedLineMove {
    from { transform: translateX(-100%); }
    to { transform: translateX(100vw); }
  }

  /* ===== LOGO CONTAINER ===== */
  .logo-container {
    position: relative;
    z-index: 10;
    text-align: center;
    animation: logoEntrance 1.5s cubic-bezier(0.2, 0.9, 0.4, 1.1) forwards;
    opacity: 0;
    transform: scale(0.3);
  }
  @keyframes logoEntrance {
    0% {
      opacity: 0;
      transform: scale(0.3) rotateY(90deg);
      filter: blur(20px);
    }
    60% {
      opacity: 1;
      transform: scale(1.15) rotateY(0);
      filter: blur(0);
    }
    100% {
      opacity: 1;
      transform: scale(1) rotateY(0);
    }
  }

  /* ===== LOGO TEXT ===== */
  .logo-main {
    font-size: 88px;
    font-weight: 900;
    letter-spacing: 8px;
    line-height: 1;
    position: relative;
    display: inline-block;
  }
  .logo-your {
    background: linear-gradient(135deg, #fff 0%, #ff1744 50%, #ff4569 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 25px rgba(255, 23, 68, 0.8));
    animation: yourGlow 2s infinite alternate;
  }
  .logo-play {
    background: linear-gradient(135deg, #2979ff 0%, #00b0ff 50%, #2979ff 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 25px rgba(41, 121, 255, 0.8));
    animation: playGlow 2s 0.3s infinite alternate;
  }
  @keyframes yourGlow {
    from { filter: drop-shadow(0 0 20px rgba(255, 23, 68, 0.6)); }
    to { filter: drop-shadow(0 0 40px rgba(255, 23, 68, 1)); }
  }
  @keyframes playGlow {
    from { filter: drop-shadow(0 0 20px rgba(41, 121, 255, 0.6)); }
    to { filter: drop-shadow(0 0 40px rgba(41, 121, 255, 1)); }
  }

  /* ===== PLAY ICON ===== */
  .logo-icon-big {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 70px;
    height: 70px;
    border-radius: 18px;
    background: linear-gradient(135deg, #ff1744, #2979ff);
    font-size: 32px;
    color: #fff;
    margin-bottom: 25px;
    box-shadow: 0 0 40px rgba(255, 23, 68, 0.8),
                0 0 80px rgba(41, 121, 255, 0.5);
    animation: iconPulse 1.5s infinite alternate;
    vertical-align: middle;
  }
  @keyframes iconPulse {
    from { transform: scale(1) rotate(0); box-shadow: 0 0 30px rgba(255, 23, 68, 0.6); }
    to { transform: scale(1.1) rotate(5deg); box-shadow: 0 0 60px rgba(41, 121, 255, 1); }
  }

  /* ===== TAGLINE ===== */
  .tagline {
    margin-top: 30px;
    font-size: 16px;
    letter-spacing: 8px;
    text-transform: uppercase;
    color: #a0a0b0;
    opacity: 0;
    animation: taglineIn 1s 1.8s forwards;
  }
  @keyframes taglineIn {
    from {
      opacity: 0;
      letter-spacing: 20px;
      filter: blur(10px);
    }
    to {
      opacity: 1;
      letter-spacing: 8px;
      filter: blur(0);
    }
  }

/* ===== RANDOM QUOTE ===== */
#quoteText {
  margin-top: 25px;
  font-size: 13px;
  font-style: italic;
  letter-spacing: 2px;
  text-transform: none;
  color: #ff6699;
  text-shadow: 0 0 15px rgba(255, 23, 68, 0.6);
  opacity: 0;
  animation: quoteIn 1s 2.2s forwards;
  padding: 0 20px;
  max-width: 90vw;
  line-height: 1.6;
}
@keyframes quoteIn {
  from { opacity: 0; transform: translateY(15px); filter: blur(8px); }
  to   { opacity: 1; transform: translateY(0);    filter: blur(0); }
}

  /* ===== PRESENTED BY PAN TEXT ===== */
  .presented-by {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 12;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    animation: presentedIn 2.5s 0.4s forwards;
    white-space: nowrap;
  }
  @keyframes presentedIn {
    0% {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.5);
      filter: blur(30px);
    }
    20% {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
      filter: blur(0);
    }
    70% {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
      filter: blur(0);
    }
    100% {
      opacity: 0;
      transform: translate(-50%, -50%) scale(1.3);
      filter: blur(10px);
    }
  }
  .presented-label {
    display: block;
    font-size: 14px;
    letter-spacing: 10px;
    color: #ff1744;
    text-transform: uppercase;
    margin-bottom: 15px;
    font-weight: 600;
    text-shadow: 0 0 20px rgba(255, 23, 68, 0.8);
  }
  .presented-name {
    display: block;
    font-size: 72px;
    font-weight: 900;
    letter-spacing: 15px;
    background: linear-gradient(135deg, #ff1744 0%, #fff 50%, #2979ff 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 30px rgba(255, 23, 68, 0.9));
    animation: nameShake 0.4s 0.6s 2;
  }
  @keyframes nameShake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }
  .presented-line {
    display: block;
    width: 200px;
    height: 2px;
    margin: 20px auto 0;
    background: linear-gradient(90deg, transparent, #ff1744, #2979ff, transparent);
    box-shadow: 0 0 20px rgba(255, 23, 68, 0.8);
    animation: lineExpand 1s 1s forwards;
    transform: scaleX(0);
  }
  @keyframes lineExpand {
    to { transform: scaleX(1); }
  }

  /* ===== PAN SILHOUETTE ===== */
  .pan-reveal {
    position: absolute;
    inset: 0;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    animation: panReveal 3.5s 0.8s forwards;
  }
  @keyframes panReveal {
    0% {
      opacity: 0;
      transform: scale(1.5);
      filter: blur(40px) brightness(3);
    }
    30% {
      opacity: 0.35;
      transform: scale(1.2);
      filter: blur(20px) brightness(1.5);
    }
    60% {
      opacity: 0.15;
      transform: scale(1);
      filter: blur(10px) brightness(1);
    }
    100% {
      opacity: 0.12;
      transform: scale(1);
      filter: blur(5px);
    }
  }
  .pan-reveal img {
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    filter: contrast(1.3) saturate(0.5) hue-rotate(-10deg);
    mix-blend-mode: screen;
  }

  /* ===== RED X EFFECT ===== */
  .red-x {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 200px;
    height: 200px;
    transform: translate(-50%, -50%);
    z-index: 6;
    opacity: 0;
    pointer-events: none;
    animation: redXFlash 0.8s 0.6s ease-out forwards;
  }
  .red-x::before,
  .red-x::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 200px;
    height: 6px;
    background: #ff1744;
    box-shadow: 0 0 30px #ff1744, 0 0 60px #ff1744;
    border-radius: 3px;
  }
  .red-x::before {
    transform: translate(-50%, -50%) rotate(45deg);
    animation: slashLeft 0.4s 0.6s ease-out forwards;
  }
  .red-x::after {
    transform: translate(-50%, -50%) rotate(-45deg);
    animation: slashRight 0.4s 0.7s ease-out forwards;
  }
  @keyframes redXFlash {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
    50% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1.8); }
  }

  /* ===== SHOCKWAVE ===== */
  .shockwave {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 100px;
    height: 100px;
    border-radius: 50%;
    border: 3px solid #ff1744;
    transform: translate(-50%, -50%) scale(0);
    z-index: 4;
    opacity: 0;
    animation: shockwave 2s 0.8s ease-out forwards;
  }
  .shockwave.blue {
    border-color: #2979ff;
    animation-delay: 1s;
  }
  @keyframes shockwave {
    0% {
      opacity: 1;
      transform: translate(-50%, -50%) scale(0);
      border-width: 8px;
    }
    100% {
      opacity: 0;
      transform: translate(-50%, -50%) scale(15);
      border-width: 1px;
    }
  }

  /* ===== FLASH OVERLAY ===== */
  .flash {
    position: absolute;
    inset: 0;
    background: #fff;
    z-index: 20;
    opacity: 0;
    pointer-events: none;
    animation: flashEffect 0.3s 0.9s ease-out;
  }
  @keyframes flashEffect {
    0% { opacity: 0; }
    50% { opacity: 0.8; }
    100% { opacity: 0; }
  }

  /* ===== LOADING BAR ===== */
  .loading-wrap {
    position: absolute;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 15;
    width: 320px;
    opacity: 0;
    animation: loadingIn 0.5s 2.5s forwards;
  }
  @keyframes loadingIn {
    to { opacity: 1; }
  }
  .loading-text {
    color: #a0a0b0;
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 10px;
    text-align: center;
    transition: opacity 0.3s;
  }
  .loading-bar {
    width: 100%;
    height: 3px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 2px;
    overflow: hidden;
    position: relative;
  }
  .loading-fill {
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, #ff1744, #2979ff, #ff1744);
    background-size: 200% 100%;
    border-radius: 2px;
    animation: loadingFill 2s 2.5s cubic-bezier(0.4, 0, 0.2, 1) forwards,
               loadingShimmer 1.5s infinite linear;
    box-shadow: 0 0 15px rgba(255, 23, 68, 0.8);
  }
  @keyframes loadingFill {
    to { width: 100%; }
  }
  @keyframes loadingShimmer {
    to { background-position: -200% 0; }
  }

  /* ===== SKIP BUTTON ===== */
  .skip-btn {
    position: absolute;
    top: 30px;
    right: 30px;
    z-index: 25;
    padding: 10px 24px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 23, 68, 0.5);
    border-radius: 25px;
    color: #fff;
    font-size: 13px;
    letter-spacing: 2px;
    cursor: pointer;
    opacity: 0;
    transition: all 0.3s ease;
    backdrop-filter: blur(10px);
    font-weight: 600;
    animation: skipIn 0.5s 1.5s forwards;
  }
  @keyframes skipIn {
    to { opacity: 1; }
  }
  .skip-btn:hover {
    background: rgba(255, 23, 68, 0.3);
    border-color: #ff1744;
    box-shadow: 0 0 25px rgba(255, 23, 68, 0.6);
    transform: scale(1.05);
  }

  /* ===== MUSIC BUTTON ===== */
  .music-btn {
    position: absolute;
    top: 30px;
    left: 30px;
    z-index: 25;
    width: 45px;
    height: 45px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(41, 121, 255, 0.5);
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
    backdrop-filter: blur(10px);
    opacity: 0;
    animation: skipIn 0.5s 2s forwards;
  }
  .music-btn:hover {
    background: rgba(41, 121, 255, 0.3);
    box-shadow: 0 0 25px rgba(41, 121, 255, 0.6);
    transform: scale(1.1);
  }
  .music-btn.muted::after {
    content: '';
    position: absolute;
    width: 30px;
    height: 2px;
    background: #ff1744;
    transform: rotate(-45deg);
    box-shadow: 0 0 10px #ff1744;
  }

  /* ===== FADE OUT EXIT ===== */
  .stage.exit {
    animation: stageExit 0.8s ease-in forwards;
  }
  @keyframes stageExit {
    0% {
      opacity: 1;
      transform: scale(1);
      filter: brightness(1);
    }
    40% {
      opacity: 1;
      transform: scale(1.05);
      filter: brightness(2);
    }
    100% {
      opacity: 0;
      transform: scale(1.2);
      filter: brightness(0);
    }
  }

  /* ===== MOBILE ===== */
  @media (max-width: 768px) {
    .logo-main { font-size: 48px; letter-spacing: 4px; }
    .logo-icon-big { width: 50px; height: 50px; font-size: 22px; }
    .tagline { font-size: 11px; letter-spacing: 4px; }
    .loading-wrap { width: 240px; bottom: 60px; }
    .skip-btn { top: 20px; right: 20px; padding: 8px 18px; font-size: 11px; }
    .red-x::before, .red-x::after { width: 140px; height: 4px; }
    .presented-name { font-size: 40px; letter-spacing: 8px; }
    .presented-label { font-size: 10px; letter-spacing: 5px; }
    .music-btn { top: 20px; left: 20px; width: 38px; height: 38px; font-size: 15px; }
  }
</style>
</head>
<body>

<div class="stage" id="stage">

  <!-- Particles -->
  <div class="particles" id="particles"></div>

  <!-- Speed Lines -->
  <div class="speed-lines" id="speedLines"></div>

  <!-- Pan Silhouette Reveal -->
  <div class="pan-reveal">
    <img src="assets/creator.png" alt="Pan">
  </div>

  <!-- Shockwaves -->
  <div class="shockwave"></div>
  <div class="shockwave blue"></div>

  <!-- Red X -->
  <div class="red-x"></div>

  <!-- Flash -->
  <div class="flash"></div>

  <!-- PRESENTED BY PAN -->
  <div class="presented-by">
    <span class="presented-label">Presented By</span>
    <span class="presented-name">PAN</span>
    <span class="presented-line"></span>
  </div>

  <!-- Logo -->
  <div class="logo-container">
    <div class="logo-icon-big">▶</div>
    <div class="logo-main">
      <span class="logo-your">YOUR</span><span class="logo-play">PLAY</span>
    </div>
    <div class="tagline">Stream Anime & Film</div>
    <div class="tagline" id="quoteText"></div>
  </div>

  <!-- Loading Bar -->
  <div class="loading-wrap">
    <div class="loading-text" id="loadingText">Memuat...</div>
    <div class="loading-bar">
      <div class="loading-fill"></div>
    </div>
  </div>

  <!-- Music Toggle -->
  <button class="music-btn" id="musicBtn" onclick="toggleMusic(event)" title="Toggle Musik">🎵</button>

  <!-- Skip Button -->
  <button class="skip-btn" onclick="skipIntro(event)">SKIP INTRO ➔</button>

</div>

<!-- ============ AUDIO ELEMENTS ============ -->
<!-- Background Music - ganti src dengan file mp3 kamu nanti -->
<audio id="bgMusic" loop preload="auto">
  <source src="assets/opening-music.mp3" type="audio/mpeg">
</audio>

<!-- Sound Effects (menggunakan Web Audio API untuk generate tone) -->
<script>
  // ============ WEB AUDIO API - SOUND EFFECTS ============
  let audioCtx = null;

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    return audioCtx;
  }

  // 🔥 BOOM SOUND (untuk logo entry)
  function playBoomSound() {
    try {
      const ctx = initAudio();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const filter = ctx.createBiquadFilter();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(120, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(30, ctx.currentTime + 0.8);

      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(200, ctx.currentTime);
      filter.frequency.exponentialRampToValueAtTime(50, ctx.currentTime + 0.8);

      gain.gain.setValueAtTime(0.5, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);

      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.9);
    } catch(e) { console.log('Audio error:', e); }
  }

  // ⚡ SLASH SOUND (untuk Red X)
  function playSlashSound() {
    try {
      const ctx = initAudio();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(2000, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.3);

      gain.gain.setValueAtTime(0.15, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.35);
    } catch(e) {}
  }

  // ✨ WHOOSH SOUND (untuk logo entry)
  function playWhooshSound() {
    try {
      const ctx = initAudio();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const filter = ctx.createBiquadFilter();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(80, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.5);
      osc.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 1);

      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(500, ctx.currentTime);

      gain.gain.setValueAtTime(0.001, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.2, ctx.currentTime + 0.2);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);

      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 1.1);
    } catch(e) {}
  }

  // 💥 IMPACT SOUND (untuk shockwave)
  function playImpactSound() {
    try {
      const ctx = initAudio();
      const bufferSize = ctx.sampleRate * 0.3;
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);

      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 3);
      }

      const source = ctx.createBufferSource();
      const gain = ctx.createGain();
      const filter = ctx.createBiquadFilter();

      source.buffer = buffer;
      filter.type = 'lowpass';
      filter.frequency.value = 400;

      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);

      source.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);

      source.start(ctx.currentTime);
    } catch(e) {}
  }

  // 🎵 TYPING SOUND (untuk text effect)
  function playTypeSound() {
    try {
      const ctx = initAudio();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = 'square';
      osc.frequency.value = 1200 + Math.random() * 400;

      gain.gain.setValueAtTime(0.03, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.06);
    } catch(e) {}
  }

  // ============ BACKGROUND MUSIC ============
  const bgMusic = document.getElementById('bgMusic');
  let musicMuted = false;

  function tryPlayMusic() {
    bgMusic.volume = 0.4;
    const playPromise = bgMusic.play();
    if (playPromise !== undefined) {
      playPromise.catch(err => {
        console.log('Autoplay diblokir, user harus interaksi dulu:', err);
        // Coba mainkan setelah interaksi pertama
        document.addEventListener('click', function once() {
          bgMusic.play().catch(() => {});
          document.removeEventListener('click', once);
        }, { once: true });
      });
    }
  }

  function toggleMusic(e) {
    if (e) e.stopPropagation();
    musicMuted = !musicMuted;
    const btn = document.getElementById('musicBtn');
    if (musicMuted) {
      bgMusic.pause();
      btn.classList.add('muted');
      btn.innerHTML = '🔇';
    } else {
      bgMusic.play().catch(() => {});
      btn.classList.remove('muted');
      btn.innerHTML = '🎵';
    }
  }

  // ============ THEME VARIATION (Random tiap load) ============
  const themes = ['', 'theme-fire', 'theme-ice', 'theme-purple'];
  const randomTheme = themes[Math.floor(Math.random() * themes.length)];
  if (randomTheme) {
    document.getElementById('stage').classList.add(randomTheme);
    console.log('🎨 Theme:', randomTheme || 'default (red+blue)');
  }

  // ============ GENERATE PARTICLES ============
  const particlesEl = document.getElementById('particles');
  for (let i = 0; i < 40; i++) {
    const p = document.createElement('div');
    p.className = 'particle' + (Math.random() > 0.5 ? ' blue' : '');
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDelay = Math.random() * 8 + 's';
    p.style.animationDuration = (5 + Math.random() * 5) + 's';
    const size = 2 + Math.random() * 3;
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    particlesEl.appendChild(p);
  }

  // ============ GENERATE SPEED LINES ============
  const speedEl = document.getElementById('speedLines');
  for (let i = 0; i < 15; i++) {
    const line = document.createElement('div');
    line.className = 'speed-line';
    line.style.top = Math.random() * 100 + '%';
    line.style.width = (50 + Math.random() * 150) + 'px';
    line.style.opacity = 0.3 + Math.random() * 0.7;
    line.style.animationDelay = Math.random() * 1.5 + 's';
    line.style.animationDuration = (0.8 + Math.random() * 1.5) + 's';
    speedEl.appendChild(line);
  }

  // ============ SOUND EFFECTS TIMELINE ============
  // Mulai musik setelah interaksi pertama atau langsung coba
  window.addEventListener('load', () => {
    setTimeout(tryPlayMusic, 100);
  });

  // Slash sound pada 0.6s (Red X)
  setTimeout(playSlashSound, 600);

  // Boom sound pada 0.9s (flash)
  setTimeout(playBoomSound, 900);

  // Whoosh sound pada 1.0s (logo entry)
  setTimeout(playWhooshSound, 1000);

  // Impact sound pada 0.8s dan 1.0s (shockwaves)
  setTimeout(playImpactSound, 800);
  setTimeout(playImpactSound, 1000);

  // Type sound untuk "PRESENTED BY PAN" (sekitar 0.4-1.5s)
  for (let i = 0; i < 20; i++) {
    setTimeout(playTypeSound, 400 + i * 60);
  }

  // ============ LOADING TEXT SEQUENCE ============
  const loadingTexts = [
    'Memuat...',
    'Menghubungkan...',
    'Menyiapkan Video...',
    'Selamat Datang 🔥'
  ];
  let textIdx = 0;
  const textEl = document.getElementById('loadingText');
  const textTimer = setInterval(() => {
    textIdx++;
    if (textIdx < loadingTexts.length) {
      textEl.style.opacity = '0';
      setTimeout(() => {
        textEl.textContent = loadingTexts[textIdx];
        textEl.style.opacity = '1';
        playTypeSound();
      }, 200);
    }
  }, 1000);

/ ============ RANDOM ANIME QUOTE ============
  const quotes = [
    "「 Dreams are the fuel of reality. 」",
    "「 Believe in yourself, not the you who believes in me. 」",
    "「 Power comes in response to a need, not a desire. 」",
    "「 The world isn't perfect. But it's there for us. 」",
    "「 If you don't take risks, you can't create a future. 」",
    "「 Wake up to reality. Nothing ever goes as planned. 」",
    "「 I'm gonna be the King of the Pirates! 」",
    "「 Hard work is worthless for those that don't believe. 」"
  ];
  const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
  document.getElementById('quoteText').textContent = randomQuote;

  // ============ SKIP / AUTO REDIRECT ============
  let redirected = false;
  function skipIntro(e) {
    if (e) e.stopPropagation();
    if (redirected) return;
    redirected = true;
    clearInterval(textTimer);

    // Fade out music
    const fadeOut = setInterval(() => {
      if (bgMusic.volume > 0.05) {
        bgMusic.volume -= 0.05;
      } else {
        bgMusic.pause();
        clearInterval(fadeOut);
      }
    }, 50);

    const stage = document.getElementById('stage');
    stage.classList.add('exit');
    setTimeout(() => {
      window.location.href = 'index.html';
    }, 700);
  }

  // Auto redirect setelah opening selesai
  setTimeout(skipIntro, 5000);

  // Klik di mana saja untuk skip (kecuali tombol music & skip)
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.skip-btn') && !e.target.closest('.music-btn')) {
      skipIntro();
    }
  });

  // Tekan tombol apapun untuk skip
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') skipIntro();
  });
</script>

</body>
</html>
